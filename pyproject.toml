[project]
name = "vanguard"
version = "0.1.0"
description = "Autonomous academic advising workflows with Azure AI Foundry, LangChain, Pydantic, and DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19.0",
    "duckdb>=1.1.0",
    "ipykernel>=6.29.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vanguard"]
